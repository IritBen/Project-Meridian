name: ${COMPOSE_PROJECT_NAME:-meridian-pipeline}

services:
  postgres:
    image: postgres:17
    #container_name: meridian-postgres
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U meridian -d meridian",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  compute:
    build: .
    environment:
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian
      BRONZE_ROOT: /bronze
    volumes:
      - bronze-data:/bronze

volumes:
  bronze-data:
