services:
  project-meridian:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian_trips
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - project-meridian

  meridian-job:
    build: .
    environment:
      DATABASE_URL: postgresql://meridian:meridian@project-meridian:5432/meridian_trips
    volumes:
      - source_files:/app/files
    depends_on:
      - project-meridian

volumes:
  pgdata:
  pgadmin_data:
  source_files:
