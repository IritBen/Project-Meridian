[project]
name = "project-meridian"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "docker>=7.2.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meridian"
